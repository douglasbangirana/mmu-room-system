; Build with the PlatformIO extension in VS Code.  Open this folder, then Build (✓) and Upload (→).
[env:esp32dev]
platform = espressif32@6.9.0      ; pinned: Arduino-ESP32 core 2.0.17 (the LED PWM calls below need core 2.x)
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.1.0
build_flags = -DCORE_DEBUG_LEVEL=0
